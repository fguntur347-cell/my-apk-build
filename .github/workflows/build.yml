name: Build Android APK Real

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Init Capacitor & Add Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "My App" "com.myapp.app" --web-dir www
          npx cap add android

      - name: Generate Icon App (if provided)
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx cap-assets generate --android
          fi

      - name: Inject Android Permissions
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let content = fs.readFileSync(manifestPath, "utf8");
              const perms = ["android.permission.INTERNET","android.permission.CAMERA","android.permission.ACCESS_FINE_LOCATION","android.permission.WRITE_EXTERNAL_STORAGE","android.permission.READ_EXTERNAL_STORAGE","android.permission.RECORD_AUDIO","android.permission.POST_NOTIFICATIONS"];
              const permTags = perms.map(p => `    <uses-permission android:name="${p}" />`).join("\n");
              content = content.replace("<application", permTags + "\n    <application");
              fs.writeFileSync(manifestPath, content);
            }
          '
          npx cap sync android

      - name: Compile Debug APK Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My_App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
